spring.application.name=parcialdos

# MySQL datasource - ajuste usuario/clave/nombre BD según tu entorno
spring.datasource.url=jdbc:mysql://localhost:3306/bankdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pass_123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true

server.port=8080

# Ejecutar scripts SQL en cada arranque
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Asegurar que Hibernate no modifique la estructura ya que la creamos con schema.sql
spring.jpa.hibernate.ddl-auto=none
